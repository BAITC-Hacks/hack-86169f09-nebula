services:
  eventmatch:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8001:8001"
    environment:
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CONTRACTORS_PATH: ${CONTRACTORS_PATH:-data/contractors.csv}
      HOST: 0.0.0.0
      PORT: "8001"
    restart: unless-stopped
